name: Build & Publish

on:
  push:
    branches: [main, experiment, develop]
    tags: ['v*']
  pull_request:
    branches: [main, experiment]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: STAT-Mod
          path: build/libs/*.jar

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true

  publish-curseforge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: STAT-Mod

      - name: Publish to CurseForge
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          game_versions: '1.21.1'
          release_type: release
          file_path: "statmod-*.jar"
          changelog: "See CHANGELOG.md"
          display_name: "STAT Mod ${{ github.ref_name }}"
          relations: |
            tensura-reincarnated:requiredDependency
            irons-spellbooks:optionalDependency
            epic-fight:optionalDependency

  publish-modrinth:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: STAT-Mod

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: statmod-*.jar
          name: "STAT Mod ${{ github.ref_name }}"
          version: ${{ github.ref_name }}
          changelog: "See CHANGELOG.md"
          game-versions: '1.21.1'
          loaders: neoforge
          dependencies: |
            tensura-reincarnated(required)
            irons-spellbooks(optional)
            epic-fight(optional)
