plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: mapping_channel, version: mapping_version

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Put repositories for dependencies here
    // ForgeGradle automatically adds the Forge maven and Maven Central for you

    flatDir {
        dir 'libs'
    }
    // JEI (optional - compile only)
    maven { url "https://maven.blamejared.com" }
    // REI (optional - compile only)
    maven { url "https://maven.shedaniel.me" }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

    // Epic Fight (local JAR)
    implementation fg.deobf("blank:epic-fight-20.14.17-mc1.20.1-forge:20.14.17")

    // ParCool toolchain (optional compat - compile only, not forced into dedicated-server runtime)
    compileOnly fg.deobf("curse.maven:parcool-482378:6612358")
    compileOnly fg.deobf("vazkii.patchouli:Patchouli:1.20.1-85-FORGE")

    // Epic Parcool - Epic Fight x ParCool compatibility (optional compat - compile only)
    compileOnly fg.deobf("blank:epicparcool-20.12.0.1-1.20.1:20.12.0.1")

    // AAA Particles (local JAR) - optional compat/content
    compileOnly fg.deobf("blank:aaa_particles-forge-1.20.1-2.2.1-beta.2:2.2.1-beta.2")

    // Invincible Lib - JSON-based skill creation framework (local JAR)
    implementation fg.deobf("blank:epic-fight-invincible-lib-20.14.8.2-mc1.20.1-forge:20.14.8.2")

    // EpicFight Nightfall v3.3.3 (local JAR in libs/) - optional compat/content
    compileOnly fg.deobf("blank:epicfight-nightfall-3.3.3-all:3.3.3")

    // EpicFight Extra v1.2 (Modrinth) - optional compat/content
    compileOnly fg.deobf("maven.modrinth:epicfight-extra:1.2")

    // Epic Fight Avalon (CurseMaven) - optional compat/content
    compileOnly fg.deobf("curse.maven:epic-fight-avalon-1268823:7619938")

    // Weapons of Miracles (local JAR) - optional compat/content
    compileOnly fg.deobf("blank:WeaponsOfMiracles-2.0.15-mc1.20.1-forge:2.0.15")

    // P1nero Bow (local JAR) - Epic Fight bow addon (optional compat - compile only)
    compileOnly fg.deobf("blank:p1nero_bow-forge1.20.1-20.14.1.6:20.14.1.6")

    // JEI (optional - compile only)
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge:15.3.0.8")
    // REI (optional - compile only)
    compileOnly fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:12.1.725")

    // FTB mods use reflection (no compileOnly needed)

    // L2Hostility (local JAR) - optional mob difficulty integration
    compileOnly fg.deobf("blank:l2hostility-2.5.19:2.5.19")
    // L2Hostility transitive deps required to compile against MobTraitCap
    compileOnly fg.deobf("blank:l2library-2.5.0-slim:2.5.0")
    compileOnly fg.deobf("blank:l2serial-1.2.2:1.2.2")

    // Dev-runtime L2Hostility stack (NOT shipped — used only for runClient testing).
    // These belong to group "blank" so they bypass validateStatModPackaging's checks
    // (which target curse.maven / vazkii.patchouli for production compat).
    runtimeOnly fg.deobf("blank:l2hostility-2.5.10:2.5.10")
    runtimeOnly fg.deobf("blank:l2library-2.5.3:2.5.3")
    runtimeOnly fg.deobf("blank:l2complements-2.5.8:2.5.8")
    runtimeOnly fg.deobf("blank:curios-forge-5.14.1:5.14.1")
    runtimeOnly fg.deobf("blank:Patchouli-1.20.1-84.1-FORGE:84.1")

}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

}

// Multi-project build: delay reobfuscation until publishing so dev JAR stays unobfuscated

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.register('validateStatModPackaging') {
    group = 'verification'
    description = 'Guards STAT Mod against server-side regressions, forced optional runtimes, and unfinished production markers.'

    doLast {
        def errors = []
        def mainJavaDir = file('src/main/java')

        def requireText = { File sourceFile, String expected, String label ->
            if (!sourceFile.text.contains(expected)) {
                errors << "${label} is missing required text: ${expected}"
            }
        }

        def forbidText = { File sourceFile, String forbidden, String label ->
            if (sourceFile.text.contains(forbidden)) {
                errors << "${label} contains forbidden text: ${forbidden}"
            }
        }

        fileTree(mainJavaDir).matching { include '**/*.java' }.files.each { sourceFile ->
            sourceFile.eachLine { line, number ->
                if (line.contains('TODO') || line.contains('FIXME')) {
                    errors << "${sourceFile.name}:${number} contains unfinished marker in production source"
                }
            }
        }

        def statModSource = file('src/main/java/tong/statmod/STATMod.java')
        requireText(statModSource, 'FtbTaskRegistry.init();', 'STATMod common setup')

        def ftbTaskRegistryFile = file('src/main/java/tong/statmod/integration/FtbTaskRegistry.java')
        requireText(ftbTaskRegistryFile, 'public static void init()', 'FtbTaskRegistry')
        forbidText(ftbTaskRegistryFile, '@SubscribeEvent', 'FtbTaskRegistry')
        forbidText(ftbTaskRegistryFile, '@Mod.EventBusSubscriber', 'FtbTaskRegistry')
        forbidText(ftbTaskRegistryFile, 'onCustomTaskEvent(Object event)', 'FtbTaskRegistry')

        def implementationDeps = configurations.implementation.allDependencies
        def runtimeOnlyDeps = configurations.runtimeOnly.allDependencies
        def compileOnlyDeps = configurations.compileOnly.allDependencies
        def requireCompileOnlyOptionalDependency = { String group, String name, String label ->
            def inCompileOnly = compileOnlyDeps.any { dep -> dep.group == group && dep.name == name }
            def inImplementation = implementationDeps.any { dep -> dep.group == group && dep.name == name }
            def inRuntimeOnly = runtimeOnlyDeps.any { dep -> dep.group == group && dep.name == name }

            if (!inCompileOnly) {
                errors << "${label} must stay compileOnly because it is optional compat"
            }
            if (inImplementation || inRuntimeOnly) {
                errors << "${label} must not be forced into the dev runtime"
            }
        }

        requireCompileOnlyOptionalDependency('curse.maven', 'parcool-482378', 'ParCool dependency')
        requireCompileOnlyOptionalDependency('vazkii.patchouli', 'Patchouli', 'Patchouli dependency')
        requireCompileOnlyOptionalDependency('blank', 'epicparcool-20.12.0.1-1.20.1', 'EpicParcool dependency')
        requireCompileOnlyOptionalDependency('blank', 'aaa_particles-forge-1.20.1-2.2.1-beta.2', 'AAA Particles dependency')
        requireCompileOnlyOptionalDependency('blank', 'epicfight-nightfall-3.3.3-all', 'EpicFight Nightfall dependency')
        requireCompileOnlyOptionalDependency('maven.modrinth', 'epicfight-extra', 'EpicFight Extra dependency')
        requireCompileOnlyOptionalDependency('curse.maven', 'epic-fight-avalon-1268823', 'Epic Fight Avalon dependency')
        requireCompileOnlyOptionalDependency('blank', 'WeaponsOfMiracles-2.0.15-mc1.20.1-forge', 'Weapons of Miracles dependency')
        requireCompileOnlyOptionalDependency('blank', 'p1nero_bow-forge1.20.1-20.14.1.6', 'P1nero Bow dependency')

        def keyMappingsFile = file('src/main/java/tong/statmod/client/StatModKeyMappings.java')
        requireText(keyMappingsFile, '@Mod.EventBusSubscriber(modid = STATMod.MODID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)', 'StatModKeyMappings')

        def statModSkillCategoriesFile = file('src/main/java/tong/statmod/skills/StatModSkillCategories.java')
        requireText(statModSkillCategoriesFile, 'ResourceLocation.fromNamespaceAndPath("statmod", "class_arts")', 'StatModSkillCategories book icon')
        forbidText(statModSkillCategoriesFile, 'textures/gui/skills/class_arts/class_arts.png', 'StatModSkillCategories texture-as-model icon')

        ['stat_scroll', 'perk_tome', 'mastery_crystal', 'class_arts'].each { modelName ->
            def modelFile = file("src/main/resources/assets/statmod/models/item/${modelName}.json")
            if (!modelFile.isFile()) {
                errors << "Missing item model: assets/statmod/models/item/${modelName}.json"
            }
        }
        def classArtsModelFile = file('src/main/resources/assets/statmod/models/item/class_arts.json')
        requireText(classArtsModelFile, '"layer0": "statmod:item/class_arts"', 'class_arts item model')
        def classArtsTextureFile = file('src/main/resources/assets/statmod/textures/item/class_arts.png')
        if (!classArtsTextureFile.isFile()) {
            errors << 'Missing item texture: assets/statmod/textures/item/class_arts.png'
        }

        def networkRulesFile = file('src/main/java/tong/statmod/network/NetworkPayloadRules.java')
        requireText(networkRulesFile, 'MAX_STAT_COUNT = PlayerStats.STAT_COUNT', 'NetworkPayloadRules')
        requireText(networkRulesFile, 'MAX_PERK_COUNT = Perk.values().length', 'NetworkPayloadRules')
        requireText(networkRulesFile, 'MAX_WEAPON_COUNT = WeaponMasteryManager.WEAPON_COUNT', 'NetworkPayloadRules')
        requireText(networkRulesFile, 'MAX_STAT_UPDATE_VALUES = PlayerStats.STAT_COUNT * 3', 'NetworkPayloadRules')

        fileTree('src/main/java/tong/statmod/network').matching { include '**/*Packet.java' }.files.each { sourceFile ->
            def sourceText = sourceFile.text
            if (sourceText.contains('readVarIntArray()')) {
                errors << "${sourceFile.name} must bound every FriendlyByteBuf.readVarIntArray call"
            }
        }

        def playerStatsFile = file('src/main/java/tong/statmod/capability/PlayerStats.java')
        requireText(playerStatsFile, 'sanitizeState();', 'PlayerStats sanitation')
        requireText(playerStatsFile, 'java.util.Arrays.fill(levels, 0);', 'PlayerStats sanitation')
        requireText(playerStatsFile, 'this.currentMana = Math.max(0, Math.min(this.currentMana, getMaxMana()));', 'PlayerStats mana clamp')

        def perkManagerFile = file('src/main/java/tong/statmod/perks/PerkManager.java')
        requireText(perkManagerFile, 'Set.copyOf(unlockedPerks)', 'PerkManager immutable view')
        requireText(perkManagerFile, 'if (Perk.byId(id) != null)', 'PerkManager perk id filter')
        forbidText(perkManagerFile, 'return unlockedPerks;', 'PerkManager mutable view')

        def weaponMasteryFile = file('src/main/java/tong/statmod/weapon/WeaponMasteryManager.java')
        requireText(weaponMasteryFile, 'sanitizeState();', 'WeaponMasteryManager sanitation')
        requireText(weaponMasteryFile, 'java.util.Arrays.fill(levels, 0);', 'WeaponMasteryManager sanitation')

        def fatigueManagerFile = file('src/main/java/tong/statmod/fatigue/FatigueManager.java')
        requireText(fatigueManagerFile, 'sanitizeState();', 'FatigueManager sanitation')
        requireText(fatigueManagerFile, 'this.fatigue = Math.max(0, Math.min(this.fatigue, this.maxFatigue));', 'FatigueManager clamp')

        def thirstManagerFile = file('src/main/java/tong/statmod/world/thirst/ThirstManager.java')
        requireText(thirstManagerFile, 'sanitizeState();', 'ThirstManager sanitation')
        requireText(thirstManagerFile, 'this.thirst = Math.max(0, Math.min(this.thirst, MAX_THIRST));', 'ThirstManager clamp')

        def statsCommandsFile = file('src/main/java/tong/statmod/command/StatsCommands.java')
        forbidText(statsCommandsFile, 'getUnlockedPerks().clear()', 'StatsCommands perk respec')
        requireText(statsCommandsFile, 'perks.resetPerks();', 'StatsCommands perk respec')
        forbidText(statsCommandsFile, 'catch (Exception ignored)', 'StatsCommands backup error handling')
        forbidText(statsCommandsFile, 'files[files.length - 1]', 'StatsCommands backup selection')
        requireText(statsCommandsFile, 'StatsBackupFiles.findLatestBackup', 'StatsCommands backup selection')
        requireText(statsCommandsFile, 'StatsBackupFiles.writeBackup', 'StatsCommands backup writing')

        def statsBackupFiles = file('src/main/java/tong/statmod/command/StatsBackupFiles.java')
        requireText(statsBackupFiles, 'static Optional<File> findLatestBackup', 'StatsBackupFiles helper')
        requireText(statsBackupFiles, 'Comparator.comparingLong', 'StatsBackupFiles ordering')

        def reportFiles = file('src/main/java/tong/statmod/io/ReportFiles.java')
        requireText(reportFiles, 'Files.createDirectories(parent.toPath());', 'ReportFiles directory creation')
        requireText(reportFiles, 'Files.writeString(target.toPath(), contents, StandardCharsets.UTF_8);', 'ReportFiles utf8 writing')

        ['src/main/java/tong/statmod/profiling/Profiler.java',
         'src/main/java/tong/statmod/compat/CompatibilityChecker.java',
         'src/main/java/tong/statmod/balance/BalanceBenchmark.java'].each { path ->
            def reportSource = file(path)
            forbidText(reportSource, 'FileWriter', reportSource.name)
            requireText(reportSource, 'ReportFiles.writeUtf8', reportSource.name)
        }

        def capabilityHandlerFile = file('src/main/java/tong/statmod/capability/CapabilityHandler.java')
        requireText(capabilityHandlerFile, 'DailyChallenge.cleanup(uuid);', 'CapabilityHandler logout cleanup')
        requireText(capabilityHandlerFile, 'PartyManager.cleanup(uuid);', 'CapabilityHandler logout cleanup')
        requireText(capabilityHandlerFile, 'NonCombatSkill.clearCooldowns(uuid);', 'CapabilityHandler logout cleanup')
        requireText(capabilityHandlerFile, 'IdentitySkill.clearCooldowns(uuid);', 'CapabilityHandler logout cleanup')
        requireText(capabilityHandlerFile, 'StatActiveSkill.clearCooldowns(uuid);', 'CapabilityHandler logout cleanup')

        def partyManagerFile = file('src/main/java/tong/statmod/party/PartyManager.java')
        requireText(partyManagerFile, 'return Set.copyOf(all);', 'PartyManager immutable snapshot')

        def profilerFile = file('src/main/java/tong/statmod/profiling/Profiler.java')
        requireText(profilerFile, 'return Collections.unmodifiableMap(lines);', 'Profiler immutable report lines')

        def nonCombatXpHandlerFile = file('src/main/java/tong/statmod/progression/NonCombatXPHandler.java')
        requireText(nonCombatXpHandlerFile, 'lastPositions.remove(event.getEntity().getUUID());', 'NonCombatXPHandler logout cleanup')

        def dailyChallengeFile = file('src/main/java/tong/statmod/challenge/DailyChallenge.java')
        requireText(dailyChallengeFile, 'cleanup(event.getEntity().getUUID());', 'DailyChallenge logout cleanup')

        def skillUnlockHandlerFile = file('src/main/java/tong/statmod/skills/SkillUnlockHandler.java')
        forbidText(skillUnlockHandlerFile, 'processed.add(player.getUUID());', 'SkillUnlockHandler dead processed state')

        def perkStateFile = file('src/main/java/tong/statmod/perks/PerkState.java')
        requireText(perkStateFile, 'effectProcessing.remove(uuid);', 'PerkState player cleanup')
        requireText(perkStateFile, 'private static final Map<UUID, Map<Integer, Long>> cooldowns', 'PerkState private cooldowns')
        requireText(perkStateFile, 'public static int recordComboHit(UUID uuid, long now, long resetWindowMs)', 'PerkState combo api')
        requireText(perkStateFile, 'public static boolean tryBeginEffectProcessing(UUID uuid)', 'PerkState effect api')
        forbidText(perkStateFile, 'public static final Map<UUID, Map<Integer, Long>> cooldowns', 'PerkState mutable public cooldowns')
        forbidText(perkStateFile, 'public static final Map<UUID, Integer> comboCounter', 'PerkState mutable public combo counter')
        forbidText(perkStateFile, 'public static final Map<UUID, Set<Integer>> hitMobTracker', 'PerkState mutable public hit tracker')
        forbidText(perkStateFile, 'public static final Set<UUID> effectProcessing', 'PerkState mutable public effect set')

        def perkDamageHandlerFile = file('src/main/java/tong/statmod/perks/PerkDamageHandler.java')
        requireText(perkDamageHandlerFile, 'PerkState.recordComboHit', 'PerkDamageHandler combo state api')
        requireText(perkDamageHandlerFile, 'PerkState.noteTrackedHit', 'PerkDamageHandler tracked hit api')
        forbidText(perkDamageHandlerFile, 'PerkState.comboCounter', 'PerkDamageHandler raw combo state')
        forbidText(perkDamageHandlerFile, 'PerkState.hitMobTracker', 'PerkDamageHandler raw hit tracker')

        def perkStatusHandlerFile = file('src/main/java/tong/statmod/perks/PerkStatusHandler.java')
        requireText(perkStatusHandlerFile, 'PerkState.tryBeginEffectProcessing', 'PerkStatusHandler effect api')
        forbidText(perkStatusHandlerFile, 'PerkState.effectProcessing', 'PerkStatusHandler raw effect state')

        def globalLootModifiersFile = file('src/main/resources/data/forge/loot_modifiers/global_loot_modifiers.json')
        requireText(globalLootModifiersFile, '"entries": ["statmod:stat_loot"]', 'Global loot modifiers registration')

        def statLootModifierDataFile = file('src/main/resources/data/statmod/loot_modifiers/stat_loot.json')
        requireText(statLootModifierDataFile, '"type": "statmod:stat_loot"', 'Stat loot modifier data')
        requireText(statLootModifierDataFile, '"conditions": []', 'Stat loot modifier conditions')

        def epicParcoolCompatFile = file('src/main/java/tong/statmod/integration/EpicParcoolCompat.java')
        requireText(epicParcoolCompatFile, 'static void cleanupPlayerCooldowns(UUID uuid)', 'EpicParcoolCompat cooldown cleanup')
        requireText(epicParcoolCompatFile, 'cleanupPlayerCooldowns(event.getEntity().getUUID());', 'EpicParcoolCompat logout cleanup')
        requireText(epicParcoolCompatFile, 'xpCooldowns.entrySet().removeIf(e -> e.getKey().startsWith(prefix));', 'EpicParcoolCompat cooldown cleanup')
        requireText(epicParcoolCompatFile, 'resourceCooldowns.entrySet().removeIf(e -> e.getKey().startsWith(prefix));', 'EpicParcoolCompat cooldown cleanup')

        if (!errors.isEmpty()) {
            throw new GradleException("STAT Mod packaging validation failed:\n - " + errors.join('\n - '))
        }

        println 'STAT Mod packaging validation passed.'
    }
}

tasks.named('check').configure {
    dependsOn 'validateStatModPackaging'
}
