plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.173'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    data {
        arguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation fileTree(dir: 'libs', include: '*.jar', exclude: ['elementals*.jar'])
    implementation fileTree(dir: 'libs/META-INF/jars', include: '*.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// Regen des JSON Puffish statiques après modif de descriptionFor / catalog. Pas une vraie
// datagen NeoForge — juste un main() qui sérialise PuffishMagicTreeBuilder dans le repo.
tasks.register('regenPuffishJson', JavaExec) {
    group = 'statmod'
    description = 'Regenerate src/main/resources/.../statmod_magic/*.json from PuffishMagicTreeBuilder'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tong.statmod.integration.puffish.PuffishMagicJsonGenerator'
    workingDir = project.projectDir
    dependsOn 'classes'
}

// Audit catalog : dump la classification (role) de tous les nœuds pour repérer les mauvaises
// inferences automatiques et préparer les overrides manuels.
tasks.register('runMagicCatalogAudit', JavaExec) {
    group = 'statmod'
    description = 'Dump the SpellRole classification for all 249 magic nodes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'tong.statmod.magic.MagicCatalogAuditTool'
    workingDir = project.projectDir
    dependsOn 'classes'
}

// Mission M5 Phase γ — régénère les recettes d'assemblage en scannant libs/*.jar.
// Le script Python détecte chaque arme par regex + heuristique de path, déduit son
// matériau et écrit data/statmod/recipe/assembly/<modid>/<weapon>.json.
tasks.register('generateAssemblyRecipes', Exec) {
    group = 'statmod'
    description = 'Scan libs/*.jar and (re)generate Phase γ assembly recipes'
    workingDir = project.projectDir
    commandLine 'python', 'tools/generate_assembly_recipes.py'
}
