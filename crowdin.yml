project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: src/main/resources
preserve_hierarchy: true

files:
  - source: /assets/statmod/lang/en_us.json
    translation: /assets/statmod/lang/%locale_with_underscore%.json
    languages_mapping:
      locale_with_underscore:
        fr: fr_fr
        de: de_de
        es: es_es
        ru: ru_ru
        zh: zh_cn
        ja: ja_jp
        pt-BR: pt_br
